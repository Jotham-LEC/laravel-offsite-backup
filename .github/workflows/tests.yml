name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Real PostgreSQL restores through Docker (pulls postgres:16 and postgres:17) in one cell.
          - php: '8.4'
            laravel: '13.*'
            docker_e2e: '1'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite3 (spatie dumps SQLite with it; offsite:verify restores with it) and 7-Zip (the AES fallback)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3 7zip && command -v 7z 7zz 7za || true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite, pdo_pgsql, pcntl, posix
          coverage: none

      - name: Require libzip AES support (the AES tests skip without it)
        run: |
          php -r 'echo "libzip ", ZipArchive::LIBZIP_VERSION, PHP_EOL; exit(ZipArchive::isEncryptionMethodSupported(ZipArchive::EM_AES_256) ? 0 : 1);'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        env:
          OFFSITE_TEST_DOCKER: ${{ matrix.docker_e2e }}
        run: vendor/bin/pest --fail-on-skipped

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, pdo_sqlite
          coverage: none

      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
